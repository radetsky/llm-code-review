name: 'LLM Code Review'
description: 'Advisory AI code review for pull requests. It posts comments and never fails the job.'
author: 'llm-code-review'

branding:
  icon: 'code'
  color: 'blue'

# The review is advisory. No step of this action fails the job:
#   - A missing API key (for example a pull request from a fork) skips the action.
#   - A failed review becomes a line in the pull request comment.
#   - The action posts reviews with the event COMMENT only.
# Do not add the job of this action to the required checks of a branch.
# Workflow values go into the environment of a step. Never write ${{ inputs.* }}
# in a script, because the text of the input would run as code.

inputs:
  api_key:
    description: 'API key for the LLM service. If it is empty, the action skips the review.'
    required: false
  base_url:
    description: 'LLM API base URL. Required in practice: the action ignores llm.base_url in the config file, because a pull request can change that file'
    required: false
  model:
    description: 'LLM model name (optional, uses the config default if not set)'
    required: false
  engine:
    description: 'Review engine: classic (one prompt), agent (tool-calling loop) or hybrid (classic proposes, agent verifies). Default: classic'
    required: false
    default: 'classic'
  thinking:
    description: 'Agent engine: turn the thinking mode of the model on or off. Values: default, on, off. Default: use the config'
    required: false
  max_steps:
    description: 'Agent engine: maximum number of steps (optional, default from the config)'
    required: false
  wall_timeout:
    description: 'Agent engine: time limit in seconds for one review (optional, default from the config)'
    required: false
  mode:
    description: 'Review mode: staged, unstaged, all (default: use base/head for pull requests)'
    required: false
  base:
    description: 'Base commit/branch for the diff (found automatically for pull requests)'
    required: false
  head:
    description: 'Head commit/branch for the diff (found automatically for pull requests)'
    required: false
  post_comment:
    description: 'Post the result as a pull request comment (default: true)'
    required: false
    default: 'true'
  inline_comments:
    description: 'Post inline comments on the changed lines (default: true)'
    required: false
    default: 'true'
  code_suggestions:
    description: 'Let the review propose code changes (default: true)'
    required: false
    default: 'true'
  context:
    description: 'Number of context lines around each change (default: 10)'
    required: false
  comment_tag:
    description: 'A short name for the comments (letters, digits, dot, dash, underscore). Use it when one pull request has more than one review, for example one for each engine.'
    required: false

outputs:
  status:
    description: 'Technical status: success, model_unavailable, skipped, error'
    value: ${{ steps.review.outputs.status || steps.settings.outputs.status }}
  outcome:
    description: 'Result of the review: success, warnings, critical, none (the review did not run)'
    value: ${{ steps.review.outputs.outcome || steps.settings.outputs.outcome }}
  critical_count:
    description: 'Number of critical issues found'
    value: ${{ steps.review.outputs.critical_count }}
  warning_count:
    description: 'Number of warnings found'
    value: ${{ steps.review.outputs.warning_count }}
  suggestion_count:
    description: 'Number of suggestions'
    value: ${{ steps.review.outputs.suggestion_count }}
  engine:
    description: 'Engine that made the result: classic, agent, agent->classic'
    value: ${{ steps.review.outputs.engine }}
  result_file:
    description: 'Path to the JSON result file'
    value: ${{ steps.review.outputs.result_file }}

runs:
  using: 'composite'
  steps:
    - name: Check settings
      id: settings
      shell: bash
      env:
        API_KEY: ${{ inputs.api_key }}
        INPUT_ENGINE: ${{ inputs.engine }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_THINKING: ${{ inputs.thinking }}
        INPUT_MAX_STEPS: ${{ inputs.max_steps }}
        INPUT_WALL_TIMEOUT: ${{ inputs.wall_timeout }}
        INPUT_CONTEXT: ${{ inputs.context }}
      run: |
        if [ -z "$API_KEY" ]; then
          echo "::notice::The review is skipped because there is no API key. A pull request from a fork has no access to secrets."
          {
            echo "run=false"
            echo "status=skipped"
            echo "outcome=none"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        engine="$INPUT_ENGINE"
        case "$engine" in
          classic | agent | hybrid) ;;
          *)
            echo "::warning::The engine is not known. The action uses classic."
            engine="classic"
            ;;
        esac

        thinking="$INPUT_THINKING"
        case "$thinking" in
          "" | default | on | off) ;;
          *)
            echo "::warning::The thinking value is not known. The action ignores it."
            thinking=""
            ;;
        esac

        mode="$INPUT_MODE"
        case "$mode" in
          "" | staged | unstaged | all) ;;
          *)
            echo "::warning::The mode is not known. The action ignores it."
            mode=""
            ;;
        esac

        number() {
          # Print the value if it is a whole number of 1 or more. Otherwise print nothing.
          if [[ "$1" =~ ^[0-9]+$ ]] && [ "$1" -ge 1 ]; then
            echo "$1"
          elif [ -n "$1" ]; then
            echo "::warning::A numeric input is not valid. The action ignores it." >&2
          fi
        }

        {
          echo "run=true"
          echo "engine=$engine"
          echo "mode=$mode"
          echo "thinking=$thinking"
          echo "max_steps=$(number "$INPUT_MAX_STEPS")"
          echo "wall_timeout=$(number "$INPUT_WALL_TIMEOUT")"
          echo "context=$(number "$INPUT_CONTEXT")"
        } >> "$GITHUB_OUTPUT"

    - name: Setup Python
      if: steps.settings.outputs.run == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      if: steps.settings.outputs.run == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        pip install -r "$ACTION_PATH/requirements-action.txt"

    - name: Determine diff range
      id: diff_range
      if: steps.settings.outputs.run == 'true'
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_SHA: ${{ github.sha }}
      run: |
        if [ -n "$INPUT_BASE" ] && [ -n "$INPUT_HEAD" ]; then
          base="$INPUT_BASE"; head="$INPUT_HEAD"
        elif [ "$EVENT_NAME" == "pull_request" ]; then
          base="$PR_BASE"; head="$PR_HEAD"
        elif [ "$EVENT_NAME" == "push" ]; then
          base="$PUSH_BEFORE"; head="$PUSH_SHA"
        else
          base="HEAD~1"; head="HEAD"
        fi
        # An empty value, a value that starts with "-" (a git option) and the
        # zero SHA of a new branch cannot be a base. Use the previous commit.
        if [[ -z "$base" || "$base" == -* || "$base" =~ ^0+$ ]]; then
          echo "::warning::The base is not valid. The action uses HEAD~1."
          base="HEAD~1"
        fi
        if [[ -z "$head" || "$head" == -* ]]; then
          echo "::warning::The head is not valid. The action uses HEAD."
          head="HEAD"
        fi
        {
          echo "base=$base"
          echo "head=$head"
        } >> "$GITHUB_OUTPUT"

    - name: Fetch the commits of the diff
      if: steps.settings.outputs.run == 'true' && steps.settings.outputs.mode == ''
      continue-on-error: true
      shell: bash
      env:
        BASE: ${{ steps.diff_range.outputs.base }}
        HEAD: ${{ steps.diff_range.outputs.head }}
      run: |
        # The diff needs both commits and their common ancestor.
        if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
          git fetch --no-tags --unshallow origin || git fetch --no-tags --depth=500 origin || true
        fi
        for ref in "$BASE" "$HEAD"; do
          git cat-file -e "${ref}^{commit}" 2>/dev/null || git fetch --no-tags origin "$ref" || true
        done

    - name: Run LLM Code Review
      id: review
      if: steps.settings.outputs.run == 'true'
      continue-on-error: true
      shell: bash
      env:
        LLM_API_KEY: ${{ inputs.api_key }}
        LLM_BASE_URL: ${{ inputs.base_url }}
        LLM_MODEL: ${{ inputs.model }}
        LLM_CODE_SUGGESTIONS: ${{ inputs.code_suggestions }}
        ACTION_PATH: ${{ github.action_path }}
        ENGINE: ${{ steps.settings.outputs.engine }}
        MODE: ${{ steps.settings.outputs.mode }}
        THINKING: ${{ steps.settings.outputs.thinking }}
        MAX_STEPS: ${{ steps.settings.outputs.max_steps }}
        WALL_TIMEOUT: ${{ steps.settings.outputs.wall_timeout }}
        CONTEXT: ${{ steps.settings.outputs.context }}
        BASE: ${{ steps.diff_range.outputs.base }}
        HEAD: ${{ steps.diff_range.outputs.head }}
      run: |
        RESULT_FILE="$RUNNER_TEMP/llm-review-result.json"
        ERROR_FILE="$RUNNER_TEMP/llm-review-error.txt"

        args=(--format json --engine "$ENGINE")
        if [ -n "$MODE" ]; then
          args+=(--mode "$MODE")
        else
          args+=(--base "$BASE" --head "$HEAD")
        fi
        [ -n "$CONTEXT" ] && args+=(--context "$CONTEXT")
        [ -n "$THINKING" ] && args+=(--thinking "$THINKING")
        [ -n "$MAX_STEPS" ] && args+=(--max-steps "$MAX_STEPS")
        [ -n "$WALL_TIMEOUT" ] && args+=(--wall-timeout "$WALL_TIMEOUT")

        echo "Running review.py with the engine $ENGINE"
        set +e
        timeout 1500 python "$ACTION_PATH/review.py" "${args[@]}" > "$RESULT_FILE" 2> "$ERROR_FILE"
        exit_code=$?
        set -e
        echo "Exit code: $exit_code"
        tail -n 20 "$ERROR_FILE" || true

        {
          echo "result_file=$RESULT_FILE"
          python "$ACTION_PATH/scripts/read_result.py" "$RESULT_FILE" "$ERROR_FILE" "$exit_code" || echo "status=error"
        } >> "$GITHUB_OUTPUT"
        exit 0

    - name: Show the result
      if: always() && steps.settings.outputs.run == 'true'
      shell: bash
      env:
        STATUS: ${{ steps.review.outputs.status }}
        OUTCOME: ${{ steps.review.outputs.outcome }}
        ENGINE: ${{ steps.review.outputs.engine }}
        CRITICAL: ${{ steps.review.outputs.critical_count }}
        WARNINGS: ${{ steps.review.outputs.warning_count }}
        SUGGESTIONS: ${{ steps.review.outputs.suggestion_count }}
        REVIEW_ERROR: ${{ steps.review.outputs.error }}
      run: |
        echo "Review summary"
        echo "  Status: ${STATUS:-not available}"
        echo "  Outcome: ${OUTCOME:-not available}"
        echo "  Engine: ${ENGINE:-not available}"
        echo "  Critical: ${CRITICAL:-0}, warnings: ${WARNINGS:-0}, suggestions: ${SUGGESTIONS:-0}"
        [ -n "$REVIEW_ERROR" ] && echo "  Error: $REVIEW_ERROR"
        exit 0

    - name: Post PR Comment
      if: always() && steps.settings.outputs.run == 'true' && inputs.post_comment == 'true' && github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        ACTION_PATH: ${{ github.action_path }}
        RESULT_FILE: ${{ steps.review.outputs.result_file }}
        REVIEW_STATUS: ${{ steps.review.outputs.status }}
        REVIEW_OUTCOME: ${{ steps.review.outputs.outcome }}
        REVIEW_ENGINE: ${{ steps.review.outputs.engine }}
        REVIEW_ERROR: ${{ steps.review.outputs.error }}
        COMMENT_TAG: ${{ inputs.comment_tag }}
      with:
        script: |
          const lib = require(`${process.env.ACTION_PATH}/scripts/post_review.js`);
          await lib.postSummary({ github, context, core, env: process.env });

    - name: Post Inline Review Comments
      if: always() && steps.settings.outputs.run == 'true' && inputs.inline_comments == 'true' && inputs.post_comment == 'true' && github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        ACTION_PATH: ${{ github.action_path }}
        RESULT_FILE: ${{ steps.review.outputs.result_file }}
        REVIEW_ERROR: ${{ steps.review.outputs.error }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        COMMENT_TAG: ${{ inputs.comment_tag }}
      with:
        script: |
          const lib = require(`${process.env.ACTION_PATH}/scripts/post_review.js`);
          await lib.postInlineReview({ github, context, core, env: process.env });
