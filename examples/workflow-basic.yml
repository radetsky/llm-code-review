# Basic LLM Code Review workflow
# Copy this file to your repository: .github/workflows/llm-code-review.yml
#
# Required secrets:
#   LLM_API_KEY - Your LLM API key
#
# Optional secrets:
#   LLM_BASE_URL - Custom API endpoint (default: from action config)
#   LLM_MODEL - Model name to use (default: from action config)
#
# The review is advisory. The action never fails the job, so do not add this
# job to the required checks of a branch. A pull request from a fork has no
# access to secrets: the action skips the review without an error.

name: LLM Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # The review needs the full history to compute the diff.

      - name: Run LLM Code Review
        uses: radetsky/llm-code-review@main
        with:
          api_key: ${{ secrets.LLM_API_KEY }}
          base_url: ${{ secrets.LLM_BASE_URL }}
          model: ${{ secrets.LLM_MODEL }}
